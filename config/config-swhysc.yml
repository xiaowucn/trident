  customer_login_api: '/swhysc/oauth-login' # 未登录直接访问trident主页，跳转至客户认证界面接口
  pd_env: false  # 未登录直接访问trident /#/login页，跳转至客户认证界面接口
  customer_role_permission_contrast:
    user_admin: '用户管理员'
    role_admin: '角色管理员'
    sponsor_super_admin: '承销保荐管理员'
    bond_super_admin: '固融管理员'
  sub_sys_config:
    overall:
