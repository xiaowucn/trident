      autodoc_overall:
        - normal
    role_admin:
      autodoc_overall:
        - normal
    sponsor_super_admin:
      autodoc_overall:
        - normal
    bond_super_admin:
      autodoc_overall:
        - normal
  auth_self:
    app_id: "user_proxy"
    secret_key: "I-do-not-know"
    token_expire: 120
