webif:
  debug: False
  http_port: 8000
  redirect_subpath: ""
  binary_json: True
  binary_key: "a2dad3f8e058303aa7f559e4ffe1d95c"
  postgresql:
    host: "100.64.0.167"
    port: 8000
    backend: 'gaussdb'  # 数据库后端类型,默认为postgres,不同backend切换需要进行数据迁移
    user: "user_proxy"
    password: "PaoDing123"
    options: "-c search_path=user_proxy"
    db_name: "piccamc_pai"
    check_interval: 60
  session:
    host: "redis"
    port: 6379
    db: 0
    password: "iZj5VqoZZEK5T2A"
    expire_seconds: 86400
  sqlalchemy:
    echo: False
  auth_common:
    enable: true
    app_id: "trident"
    secret_key: "6326f0c737a543e9aa7bcb88dc0cbaf9"
    token_expire: 900
