sys: "west"
logging:
  level: "info"

webif:
  debug: False
  http_port: 8000
  redirect_subpath: ""
  postgresql:
    host: "postgres"
    port: 5432
    user: "postgres"
    password: "iZj5VqoZZEK5T2A"
    db_name: "trident"
    check_interval: 60
  session:
    host: "redis"
    port: 6379
    db: 0
    password: 'iZj5VqoZZEK5T2A'
    expire_seconds: 86400
  sqlalchemy:
    echo: False
  auth_common:
    enable: true
    app_id: "trident"
    secret_key: "6326f0c737a543e9aa7bcb88dc0cbaf9"
    token_expire: 900
    exclude_domain: true
    token_single_effective: True

unify_auth:
  auto_create_user: True
  show_role_manage: True
  allow_sys_admin_sso: False  # 是否允许系统管理员使用单点登录
  push_to_sub_sys_time: 30
  push_to_sub_systems: [ 'autodoc_overall', 'grater' ]
  permission:
    autodoc_overall:
      normal: "普通用户"
      admin: "管理员"
      dep_admin: "部门管理员"
    grater:
      normal: "普通用户"
      admin: "管理员"
  auth_self:
    app_id: "user_proxy"
    secret_key: "I-do-not-know"
    token_expire: 120
  auth_config:
    auth_autodoc_overall:
      app_id: "autodoc"
      secret_key: "show-me-the-money"
      token_expire: 120
      host: ""
      internal_host: "http://autodoc:8000"
      subpath: "autodoc/"
      auth_api: "api/v1/user/unify-login"
      logout_api: "api/v1/logout"
      push_users_api: "api/v1/west/users"
      push_projects_api: "api/v1/west/projects"
    auth_grater:
      app_id: "west_grater"
      secret_key: "yU1DdSNPKk6V0hU0hw"
      token_expire: 120
      host: ""
      internal_host: "http://grater:8000"
      subpath: "grater/"
      auth_api: "api/v2/user/unify-login"
      push_users_api: "api/v2/users/sync"
      logout_api: "api/v2/logout"

front_config:
  user_manage: True
  sub_sys_config:
    overall:
      open: true
      title: '文档智能审核'
    grater:
      open: true
      title: '银行流水识别'
