      open: true
      title: "文档信息抽取与审核"
      captions: "支持对各类长文本及制式表单进行关键信息抽取与内容审核，提升信息处理效率。"
    overall:
      open: true
      title: "文档智能复核"
      captions: "基于大模型技术，为各类文档提供基础错误检查，有效提升报备文件质量，减少因反复修改带来的效率损耗。"
    pdflux:
      open: true
      title: "通用文档结构识别"
      captions: "能够自动识别各类文档结构，从复杂版式 PDF 中高效、准确地提取各类表格数据，并支持转换为 Excel 格式。"
