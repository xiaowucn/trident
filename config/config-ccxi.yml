sys: "ccxi"

logging:
  level: "info"

webif:
  debug: False
  http_port: 8000
  redirect_subpath: ""
  postgresql:
    host: "postgres"
    port: 5432
    user: "postgres"
    password: ""
    db_name: "user_proxy"
    check_interval: 60
  session:
    host: "redis"
    port: 6379
    db: 1
    password: "trident"
    expire_seconds: 3600
  sqlalchemy:
    echo: False

unify_auth:
  auto_create_user: True
  clear_session_when_get_off: True  # trident仅作为跳板时,每次跳转都清除session
  permission:
    scriber:
      remark: "标注"
      browse: "浏览"
      manage_prj: "管理项目"
      manage_user: "用户管理"
      manage_mold: "schema管理"
      manage_model: "模型管理"
    calliper:
      normal: "普通用户"
      admin: "管理员"
  auth_self:
    app_id: "user_proxy"
    secret_key: "I-do-not-know"
    token_expire: 120
  auth_config:
    auth_scriber:
      app_id: "remarkable"
      secret_key: "hello_remarkable"
      token_expire: 120
      host: "http://scriber"
      allowed_args: [ 'prj_num', 'version']  # ccxi参数
      subpath: ""
      auth_api: "api/v1/user/unify-login"
      logout_api: "api/v1/logout"
    auth_calliper:
      app_id: "calliper"
      secret_key: "hello_calliper"
      token_expire: 120
      host: "http://calliper"
      subpath: ""
      auth_api: "api/v1/user/unify-login"
      logout_api: "api/v1/logout"

front_config:
  sub_sys_config:
    scriber:
      open: true
      title: '合同智能审核'
    calliper:
      open: true
      title: '文档智能对比'

cas_auth:
  sys: "scriber"
  server: "http://base-t.ccxi.com.cn:9691/accounts/"
  validate_uri: "serviceValidate"
  login_uri: "login"
  logout_uri: ""
  cas_token_session_key: 'ticket'
  cas_username_session_key: "CAS_USERNAME"
  cas_attributes_session_key: "CAS_ATTRIBUTES"
  cas_after_login: "/api/v1/get-off"
  cas_after_logout: ""
