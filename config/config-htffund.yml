unify_auth:
  auto_create_user: True
  permission:
    foundry:
      normal: "普通用户"
      admin: "管理员"
    pdflux:
      normal: "普通用户"
    hunter:
      normal: "普通用户"
      admin: "管理员"
  auth_self:
    app_id: "user_proxy"
    secret_key: "I-do-not-know"
    token_expire: 120
  auth_config:
    auth_foundry:
      app_id: "foundry"
      secret_key: "hello_foundry"
      token_expire: 120
      host: ""
      subpath: "" # foundry/
      auth_api: "api/v1/user/unify-login"
      logout_api: "api/v1/logout"
    auth_pdflux:
      app_id: "pfbbackend"
      secret_key: "hello_pfbbackend"
      token_expire: 120
      host: "http://pdflux"
      subpath: "" # pdflux/
      auth_api: "api/v1/user/unify-login"
      logout_api: "api/v1/common-logout"
    auth_hunter:
      app_id: "hunter"
      secret_key: "hello_hunter"
      token_expire: 120
      host: "http://hunter"
      subpath: "" # hunter/
      auth_api: "api/v1/user/unify-login"
      logout_api: "api/v1/logout"

front_config:
  auto_redirect_sub_sys: False
  allow_change_password: True
  internal: False  # 标记内部环境，用于区分内外环境登录、退出等差异
  customer_login_api: "/user/cas-login" # 未登录直接访问trident主页，跳转至客户认证界面接口
  pd_env: false  # 未登录直接访问trident /#/login页，跳转至客户认证界面接口
  sub_sys_config:
    foundry:
      open: true
      title: "NLP标注与训练"
    pdflux:
      open: true
      title: "非结构化文档解析"
    hunter:
      open: true
      title: "文档综合搜索"

