  postgresql:
    host: "postgres"
    port: 5432
    user: "postgres"
    password: "WdpJTrzon18vcUSL"
    db_name: "trident"
    check_interval: 60
  session:
    host: "redis"
    port: 6379
    db: 0
    password: 'WdpJTrzon18vcUSL'
