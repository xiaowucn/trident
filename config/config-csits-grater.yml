#Grater和PDFlux Webtools对应的Trident配置

sys: "csits"

logging:
  level: "debug"

webif:
  debug: False
  http_port: 8000
  redirect_subpath: ""
  postgresql:
    host: "postgres"
    port: 5432
    user: "postgres"
    password: "6vPS8wv9FCQq"
    db_name: "user_proxy"
    check_interval: 60
  session:
    host: "redis"
    port: 6379
    db: 1
    password: "6vPS8wv9FCQq"
    expire_seconds: 3600
  sqlalchemy:
    echo: False
  auth_common:
    enable: true
    app_id: "csits_trident"
    secret_key: "aWXqRQzDT"
    token_expire: 120
    exclude_domain: true

unify_auth:
  auto_create_user: True
  permission:
    pdflux:
      normal: "普通用户"
      admin: "管理员"
    grater:
      normal: "普通用户"
      admin: "管理员"
      operation_admin: "运营管理员"
  auth_self:
    app_id: "user_proxy"
    secret_key: "I-do-not-know"
    token_expire: 120
  auth_config:
    auth_pdflux:
      app_id: "pfbbackend"
      secret_key: "hello_pfbbackend"
      token_expire: 120
      host: ""
      subpath: "pdflux/"
      auth_api: "api/v1/user/unify-login"
      logout_api: "api/v1/common-logout"
    auth_grater:
      app_id: "csits_grater"
      secret_key: "yU1DdSNPKk6V0hU0hw"
      token_expire: 120
      host: ""
      subpath: "grater/"
      auth_api: "api/v2/user/unify-login"
      logout_api: "api/v2/logout"

front_config:
  user_manage: False # 展示用户管理界面
  sub_sys_config:
    pdflux:
      open: true
      title: "PDFlux通用文档结构识别"
    grater:
      open: true
      title: "Grater银行流水识别"

oa_auth_url: "http://neris-zsit.csrc.gov.cn/portal/"

cas_auth:
  server: "http://neris-zsit.csrc.gov.cn"
  cas_token_session_key: "ticket"
  cas_username_session_key: "CAS_USERNAME"
  cas_attributes_session_key: "CAS_ATTRIBUTES"
  cas_after_login: ""
  cas_after_logout: "/api/v1/user/cas-login"
  login_uri: "/cas/login"
  logout_uri: "/cas/logout"
  validate_uri: "/cas/serviceValidate"
  system_name: ""

csits_track:
  start_api: ""
  end_api: ""

csits_auth:
  department_enable: True
  department_host: ""
  department_api: "/urms-api/api/v4/userInfo/getUserInfoByUserId"
  user_role_api: "/urms-api/api/v4/role/roleAllByUserId"
  user_info_api: "/urms-api/api/v4/userInfo/getUserByAcctNbr"
  org_id: 300
  org_unit_tree_api: "/urms-api/api/v4/orgUnit/getOrgUnitTreeV36"
  org_user_infos_api: "/urms-api/api/v4/userInfo/getOrgUserInfos"
  user_infos_api: "/urms-api/api/v4/userInfo/getUserInfos"
  main_department_api: "/urms-api/api/v4/userInfo/getMasterOrgIdByUserId"
  sys_code: "trident"
  secret_key: "DFA921EC7F1F0CFB4AA21E31913DC756"  # sm4解密key
  timeout: 30
