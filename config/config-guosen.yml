  http_port: 8000
  redirect_subpath: ""
  postgresql:
    host: "postgres"
    port: 5432
    user: "postgres"
    password: "kFA3C4dprQao"
    db_name: "user_proxy"
    check_interval: 60
  session:
    host: "redis"
