[tool.black]
line-length = 160
skip-string-normalization = true
target-version = ['py312']
exclude = '^(?!user_proxy)'

[project]
name = "trident"
version = "0.1.0"
description = "trident"
readme = "README.md"
requires-python = "~=3.12.0"
dependencies = [
    "aiohttp==3.11.18",
    "alembic==1.15.2",
    "amqp==5.3.1",
    "astroid==3.3.9",
    "casdoor==1.1.5",
    "celery==5.5.1",
    "certifi==2019.6.16",
    "cryptography==37.0.2",
    "cx-oracle==8.3.0",
    "gmssl==3.2.2",
    "grpcio==1.71.0",
    "grpcio-tools==1.71.0",
    "gunicorn==23.0.0",
    "jinja2==2.11.2",
    "jinja2-cli==0.8.2",
    "kafka-python==2.1.5",
    "kazoo==2.9.0",
    "kombu==5.5.3",
    "lazy-object-proxy==1.9.0",
    "mako==1.0.13",
    "markupsafe==1.1.1",
    "mccabe==0.6.1",
    "nest-asyncio==1.5.1",
    "openpyxl==3.0.0",
    "pillow==11.2.1",
    "prettytable==3.16.0",
    "psycopg2-binary==2.9.10",
    "pyaml==17.12.1",
    "pyasn1==0.6.1",
    "pyasn1-modules==0.4.2",
    "pydes==2.0.1",
    "pyhive==0.7.0",
    "pyjwt==2.4.0",
    "jwcrypto==1.5.6",
    "python-dateutil==2.8.2",
    "python-editor==1.0.4",
    "python-ldap==3.4.4",
    "python3-pika==0.9.14",
    "pytz==2018.4",
    "pyyaml==5.3.1",
    "redis-py-cluster==2.1.3",
    "requests==2.32.3",
    "rsa==4.9.1",
    "setuptools==79.0.1",
    "sqlalchemy==1.4.46",
    "suds-py3==1.4.5.0",
    "thrift==0.20.0",
    "thrift-sasl==0.4.3",
    "tornado==6.4.2",
    "utensils>=0.1.90",
    "vine==5.1.0",
    "wrapt==1.12.1",
    "wtforms==2.2.1",
    "wtforms-json==0.3.5",
    "wtforms-tornado==0.0.2",
    "xmltodict==0.12.0",
    "invoke>=2.2.0",
]

[dependency-groups]
dev = [
    "black==25.1.0",
    "check-requirements-txt>=1.2.3",
    "coverage>=7.8.0",
    "flake8>=4.0.1",
    "isort==6.0.1",
    "mock>=5.2.0",
    "pre-commit==2.16.0",
    "pydocstyle>=6.3.0",
    "pylint==3.3.6",
    "pytest>=8.3.5",
    "pytest-cov>=6.1.1",
    "pytest-pep8>=1.0.6",
    "pytest-runner>=6.0.1",
    { include-group = "ops" },
]

ops = [
    "cython",
    "pexpect>=4.9.0",
    "supervisor>=6.6.9"
]

[tool.uv]
default-groups = ["ops"]
package = false
allow-insecure-host = ["100.64.0.1", "mirrors.tuna.tsinghua.edu.cn", "repo.huaweicloud.com"]
upgrade-package = [
    "utensils",
    "supervisor",
    "invoke",
]

[tool.uv.sources]
utensils = { index = "private_pypi" }
openpyxl = { index = "private_pypi" }
supervisor = { index = "private_pypi" }
invoke = { index = "private_pypi" }

[[tool.uv.index]]
name = "private_pypi"
url = "http://100.64.0.1:3141/cheftin/pypi"

[[tool.uv.index]]
url = "https://mirrors.tuna.tsinghua.edu.cn/pypi/web/simple"
default = true
